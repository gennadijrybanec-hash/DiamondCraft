name: Build DiamondCraft Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/diamondcraft-play-compliance-v206-20261103

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify Fragment resolution
        shell: bash
        run: |
          gradle :app:dependencyInsight --dependency androidx.fragment:fragment --configuration releaseRuntimeClasspath | tee fragment-dependency.txt
          grep -F 'androidx.fragment:fragment:1.9.1' fragment-dependency.txt

      - name: Compile and run available unit tests
        run: gradle :core:test :app:testDebugUnitTest

      - name: Prepare Google Play upload key
        shell: bash
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.DIAMONDCRAFT_UPLOAD_KEYSTORE_B64 }}
        run: |
          test -n "$UPLOAD_KEYSTORE_B64" || { echo "Missing DIAMONDCRAFT_UPLOAD_KEYSTORE_B64 secret"; exit 1; }
          printf '%s' "$UPLOAD_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/diamondcraft-upload.jks"

      - name: Verify Google Play upload key
        shell: bash
        env:
          DIAMONDCRAFT_KEYSTORE_PASSWORD: ${{ secrets.DIAMONDCRAFT_KEYSTORE_PASSWORD }}
          DIAMONDCRAFT_KEY_ALIAS: ${{ secrets.DIAMONDCRAFT_KEY_ALIAS }}
        run: |
          keytool -list \
            -keystore "$RUNNER_TEMP/diamondcraft-upload.jks" \
            -storepass "$DIAMONDCRAFT_KEYSTORE_PASSWORD" \
            -alias "$DIAMONDCRAFT_KEY_ALIAS"

      - name: Build R8-optimized signed release APK and AAB
        env:
          DIAMONDCRAFT_KEYSTORE_PATH: ${{ runner.temp }}/diamondcraft-upload.jks
          DIAMONDCRAFT_KEYSTORE_PASSWORD: ${{ secrets.DIAMONDCRAFT_KEYSTORE_PASSWORD }}
          DIAMONDCRAFT_KEY_ALIAS: ${{ secrets.DIAMONDCRAFT_KEY_ALIAS }}
          DIAMONDCRAFT_KEY_PASSWORD: ${{ secrets.DIAMONDCRAFT_KEY_PASSWORD }}
        shell: bash
        run: |
          gradle :app:assembleRelease :app:bundleRelease
          test -s app/build/outputs/mapping/release/mapping.txt

      - name: Collect release APK, AAB and R8 mapping
        shell: bash
        run: |
          mkdir -p release-files
          cp app/build/outputs/apk/release/*.apk release-files/DiamondCraft-v206-release.apk
          cp app/build/outputs/bundle/release/*.aab release-files/DiamondCraft-v206-google-play.aab
          cp app/build/outputs/mapping/release/mapping.txt release-files/DiamondCraft-v206-mapping.txt

      - name: Upload signed APK, AAB and R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: DiamondCraft-v206-GooglePlay-AAB-and-APK
          path: release-files/*
